[package]
name = "ykushctrl"
version = "0.4.1"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "Control application for the Yepkit YKUSH3 switchable USB hub"
readme = "README.md"
repository = "https://github.com/gerhard-schuster/ykush-rs"
keywords = ["usb", "hub", "hid", "ykush", "yepkit"]
categories = ["command-line-utilities", "hardware-support"]

# The library is the product; the ykushctrl binary is a front end to it. Its
# name drops the "cmd", which would be wrong in a use path.
[lib]
name = "ykush"

[features]
# The FakeBoard test double, so code built on the library can be tested
# without hardware. Off by default: the plain library ships no test gear and
# no panicking paths.
fake = []

[dependencies]
# Not from crates.io: 0.5.3 stops delivering input reports on macOS after a
# few hundred writes on a handle that stays open (fixed by
# sidit77/async-hid#46, in upstream main), and the exclusive open on macOS
# needs OpenOptions from sidit77/async-hid#55, not merged yet. Pinned to the
# revision of #55 on the fork; switch to a version requirement once 0.6.0
# with #55 is released.
async-hid = { version = "0.6", git = "https://github.com/gerhard-schuster/async-hid", rev = "1d1a2bf422219b1332f1a46ec4b9b1bc1b29e08e" }
# block_on and the stream adapter for enumeration; async-io only for the timer
# the read races against, since async-hid has no timed read.
async-io = "2"
futures-lite = "2"

# Linux only: flock on the hidraw node, so that concurrent invocations take
# turns at a board. Already in the tree through async-io, at the same version
# and with the same feature; naming it here adds no crate to the build.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# This package's own tests - the binary's included - use FakeBoard, which
# sits behind the feature. A dev-dependency of the package on itself is how
# the feature gets turned on for the tests and for nothing else.
ykushctrl = { path = ".", features = ["fake"] }

[profile.release]
opt-level = "s"
strip = true
# Both are size measures and change no behaviour. Together they take the binary
# from 557 to 407 kB against a clean build about a second longer. `opt-level`
# stays at "s": "z" measured 320 bytes larger here, because it switches off
# optimisations that shrink this code.
lto = true
codegen-units = 1
