name: CI

on:
  push:
  pull_request:

# The jobs build, test and lint; none of them writes back to the repository,
# so the token gets read access and nothing more.
permissions:
  contents: read

# A push that supersedes an earlier one cancels it rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: "1.99.0"

# The actions are pinned to commits rather than tags, which anyone with write
# access to the action repository could repoint. The comment names the tag the
# commit carried when it was pinned.
#
# Checkouts do not persist credentials: the jobs run code from the checkout
# (build scripts, tests), which must not find a token lying in .git/config.
#
# Every job runs on both supported systems. The Linux runner is arm64 because
# the source compiles for Linux on aarch64 only; ubuntu-latest is x86_64 and
# would stop at the compile_error! in src/lib.rs.

jobs:
  # The hardware tests are #[ignore]d and stay out of this; what runs here is
  # everything that needs no board.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cache the registry and the build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - run: cargo build --release --locked
      - run: cargo test --locked

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cache the registry and the build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - run: rustup component add rustfmt clippy
      - run: rustup target add aarch64-unknown-freebsd
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --target aarch64-unknown-freebsd -- -D warnings

  # Checks that the rust-version in Cargo.toml is the truth rather than a wish.
  minimum-supported-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The version stays inside the shell instead of passing through a step
      # output: a `${{ }}` interpolation into a run block would splice whatever
      # the value contains into the script.
      - name: Build with the rust-version from Cargo.toml
        run: |
          msrv="$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)"
          rustup toolchain install "$msrv" --profile minimal --target aarch64-unknown-freebsd
          cargo "+$msrv" check --all-targets --locked
          cargo "+$msrv" check --all-targets --locked --target aarch64-unknown-freebsd
